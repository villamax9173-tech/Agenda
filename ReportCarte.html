<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="stylesheet" href="menu.css">
<meta charset="UTF-8">
<title>Report Carte</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    text-align: right;
}

th {
    background: #333;
    color: white;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

.totali {
    display: flex;
    justify-content: space-around;
    font-size: 18px;
    font-weight: bold;
}

.cart { color: #0b3d91; }      /* blu scuro */
.nexi { color: #66b3ff; }      /* blu chiaro */
.tot { color: #2e8b57; }       /* verde */

</style>
</head>

<body>
<div id="menu-container"></div>
<div class="container">

<h1>💳 Report Spese Carte</h1>

<div class="card totali">
    <div class="cart">Cartimpronta: <span id="totCart"></span></div>
    <div class="nexi">Nexi: <span id="totNexi"></span></div>
    <div class="tot">Totale: <span id="totAll"></span></div>
</div>

<div class="card">
    <canvas id="grafico"></canvas>
</div>

<div class="card">
    <h3>📅 Dettaglio Mensile</h3>
    <table id="tabella">
        <thead>
            <tr>
                <th>Anno</th>
                <th>Mese</th>
                <th>Cartimpronta</th>
                <th>Nexi</th>
                <th>Totale</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h3>📊 Totali per Anno</h3>
    <table id="tabellaAnno">
        <thead>
            <tr>
                <th>Anno</th>
                <th>Cartimpronta</th>
                <th>Nexi</th>
                <th>Totale</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>
<script>

fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});

</script>
<script>

const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetReportCarte?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

const mesi = [
    "", "Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno",
    "Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"
];

fetch(url)
.then(r => r.json())
.then(data => {

    // 🔽 ORDINA DESC
    data.sort((a,b) => (b.anno*100 + b.mese) - (a.anno*100 + a.mese));

    let labels = [];
    let cart = [];
    let nexi = [];
    let tot = [];

    let totCart = 0;
    let totNexi = 0;

    let perAnno = {};

    const tbody = document.querySelector("#tabella tbody");

    data.forEach(r => {

        let label = r.anno + "-" + String(r.mese).padStart(2,'0');

        labels.unshift(label); // grafico resta crescente
        cart.unshift(r.cartimpronta);
        nexi.unshift(r.nexi);
        tot.unshift(r.totale);

        totCart += r.cartimpronta;
        totNexi += r.nexi;

        // aggregazione per anno
        if (!perAnno[r.anno]) {
            perAnno[r.anno] = { cart:0, nexi:0 };
        }
        perAnno[r.anno].cart += r.cartimpronta;
        perAnno[r.anno].nexi += r.nexi;

        tbody.innerHTML += `
            <tr>
                <td>${r.anno}</td>
                <td>${mesi[r.mese]}</td>
                <td class="cart">${format(r.cartimpronta)}</td>
                <td class="nexi">${format(r.nexi)}</td>
                <td class="tot">${format(r.totale)}</td>
            </tr>
        `;
    });

    document.getElementById("totCart").innerText = format(totCart);
    document.getElementById("totNexi").innerText = format(totNexi);
    document.getElementById("totAll").innerText = format(totCart + totNexi);

    // 📊 GRAFICO
    new Chart(document.getElementById("grafico"), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Cartimpronta',
                    data: cart,
                    borderColor: '#0b3d91',
                    backgroundColor: '#0b3d91',
                    borderWidth: 2
                },
                {
                    label: 'Nexi',
                    data: nexi,
                    borderColor: '#66b3ff',
                    backgroundColor: '#66b3ff',
                    borderWidth: 2
                },
                {
                    label: 'Totale',
                    data: tot,
                    borderColor: '#2e8b57',
                    backgroundColor: '#2e8b57',
                    borderWidth: 3
                }
            ]
        }
    });

    // 📊 TABELLA ANNUALE
    const tbodyAnno = document.querySelector("#tabellaAnno tbody");

    Object.keys(perAnno)
        .sort((a,b)=> b-a)
        .forEach(anno => {

            let c = perAnno[anno].cart;
            let n = perAnno[anno].nexi;

            tbodyAnno.innerHTML += `
                <tr>
                    <td>${anno}</td>
                    <td class="cart">${format(c)}</td>
                    <td class="nexi">${format(n)}</td>
                    <td class="tot">${format(c+n)}</td>
                </tr>
            `;
        });

});

function format(num) {
    let n = Math.round(num).toString();
    return n.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

</script>

</body>
</html>
