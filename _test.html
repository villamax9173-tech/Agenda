<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Movimenti Conto Corrente</title>

<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 6px rgba(0,0,0,0.08);
}

/* TABELLA SOBRIA */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
}

th {
    background: #2c3e50;
    color: white;
    text-align: left;
}

td {
    border-bottom: 1px solid #eee;
}

tr:hover {
    background: #fafafa;
}

/* IMPORTI */
.importo {
    text-align: right;
    font-weight: bold;
}

.dare {
    color: #c0392b;   /* rosso soft */
}

.avere {
    color: #2e7d32;   /* verde soft */
}

/* DATA */
.data {
    color: #666;
    font-size: 13px;
}

/* CAUSALE */
.causale {
    font-size: 14px;
}

/* GRAFICI */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

</style>
</head>

<body>

<div id="menu-container"></div>

<div class="container">
<h1>Movimenti Conto Corrente</h1>

<!-- 📋 TABELLA -->
<div class="card">
<table id="tabella">
<thead>
<tr>
<th>Data</th>
<th>Causale</th>
<th style="text-align:right">Importo</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- 📊 GRAFICI -->
<div class="grid">

<div class="card">
    <h3>Saldo nel tempo</h3>
    <canvas id="saldoChart"></canvas>
</div>

<div class="card">
    <h3>Entrate vs Uscite</h3>
    <canvas id="pieChart"></canvas>
</div>

</div>

<div class="card">
    <h3>Spesa per giorno</h3>
    <canvas id="barChart"></canvas>
</div>

</div>

<script>
// MENU
fetch("menu.html")
.then(r=>r.text())
.then(d=>document.getElementById("menu-container").innerHTML=d);

const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCCTop?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

let dati=[];

const mesi = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

fetch(url)
.then(r=>r.json())
.then(json=>{

    dati = json.map(r=>{
        let d = normalizzaData(r.DataContabile);
        let date = new Date(d);

        return {
            data: date,
            label: date.getDate()+" "+mesi[date.getMonth()],
            causale: (r.Causale||"").trim(),
            importo: parseFloat(r.Importo),
            tipo: r.azione
        };
    });

    dati.sort((a,b)=>a.data-b.data);

    renderTabella();
    creaGrafici();
});

// NORMALIZZA DATA
function normalizzaData(d){
    if(!d) return "";
    let clean = d.replace(/[^\d-]/g,"");
    return clean.substring(0,10);
}

// TABELLA
function renderTabella(){
    const tbody=document.querySelector("#tabella tbody");
    tbody.innerHTML="";

    dati.slice().reverse().forEach(r=>{

        let tipoClass = r.tipo==="D"?"dare":"avere";

        tbody.innerHTML+=`
        <tr>
            <td class="data">${r.label}</td>
            <td class="causale">${r.causale}</td>
            <td class="importo ${tipoClass}">
                ${r.importo.toFixed(2)}
            </td>
        </tr>`;
    });
}

function creaGrafici(){

    let oggi = new Date();
    let meseCorrente = oggi.getMonth();
    let annoCorrente = oggi.getFullYear();

    // 🔴 FILTRO: solo uscite del mese corrente
    let filtrati = dati.filter(r=>{
        return r.importo < 0 &&
               r.data.getMonth() === meseCorrente &&
               r.data.getFullYear() === annoCorrente;
    });

    let labels=[];
    let saldo=[];
    let cumulato=0;

    let entrate=0; // rimane 0 (solo uscite)
    let uscite=0;

    let perGiorno={};

    filtrati.forEach(r=>{

        cumulato+=Math.abs(r.importo);

        labels.push(r.label);
        saldo.push(cumulato);

        uscite+=Math.abs(r.importo);

        if(!perGiorno[r.label]) perGiorno[r.label]=0;
        perGiorno[r.label]+=Math.abs(r.importo);
    });

    // 📈 SALDO (cumulato spese)
    new Chart(document.getElementById("saldoChart"),{
        type:"line",
        data:{
            labels:labels,
            datasets:[{
                label:"Spesa cumulata",
                data:saldo
            }]
        }
    });

    // 🥧 PIE (solo uscite)
    new Chart(document.getElementById("pieChart"),{
        type:"pie",
        data:{
            labels:["Uscite"],
            datasets:[{
                data:[uscite]
            }]
        }
    });

    // 📊 BAR (spesa per giorno)
    let giorni = Object.keys(perGiorno);

    giorni.sort((a,b)=> new Date(a) - new Date(b));

    new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:giorni,
            datasets:[{
                label:"Speso",
                data:giorni.map(g=>perGiorno[g])
            }]
        }
    });

}    
    
// GRAFICI
function creaGraficiOLd(){

    let labels=[];
    let saldo=[];
    let cumulato=0;

    let entrate=0;
    let uscite=0;

    let perGiorno={};

    dati.forEach(r=>{

        cumulato+=r.importo;

        labels.push(r.label);
        saldo.push(cumulato);

        if(r.importo>0) entrate+=r.importo;
        else uscite+=Math.abs(r.importo);

        if(!perGiorno[r.label]) perGiorno[r.label]=0;
        perGiorno[r.label]+=Math.abs(r.importo);
    });

    new Chart(document.getElementById("saldoChart"),{
        type:"line",
        data:{labels:labels,datasets:[{label:"Saldo",data:saldo}]}
    });

    new Chart(document.getElementById("pieChart"),{
        type:"pie",
        data:{
            labels:["Entrate","Uscite"],
            datasets:[{data:[entrate,uscite]}]
        }
    });

    new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:Object.keys(perGiorno),
            datasets:[{label:"Speso",data:Object.values(perGiorno)}]
        }
    });

}
</script>

</body>
</html>
