<!DOCTYPE html>
<html lang="it">

<head>

<link rel="stylesheet" href="menu.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlante Economico</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:20px;
background:#f7f7f7;
}

h1{
text-align:center;
margin-bottom:30px;
}

.graficoBox{
width:100%;
max-width:1400px;
margin:auto;
}

canvas{
width:100%;
height:420px;
margin-bottom:60px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:30px;
font-size:13px;
}

th,td{
padding:6px;
border:1px solid #ddd;
text-align:right;
}

th{
background:#eeeeee;
}

th:first-child,
td:first-child{
text-align:center;
font-weight:bold;
}

.pos{color:green;font-weight:bold;}
.neg{color:red;font-weight:bold;}
.zero{color:#444;}

.deltaUp{color:green;font-weight:bold;}
.deltaDown{color:red;font-weight:bold;}
.deltaFlat{color:#888;}

.delta{
font-size:11px;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<h1>Atlante Economico</h1>

<div class="graficoBox">
<canvas id="graficoAnni"></canvas>
</div>

<div class="graficoBox">
<canvas id="graficoMesi"></canvas>
</div>

<table id="tabella">

<thead>

<tr id="headerRow">

<th>Anno</th>

</tr>

</thead>

<tbody></tbody>

</table>

<script>

fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});

</script>

<script>

const API="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetAtlante?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="

const mesi=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Sett","Ott","Nov","Dic"]

let dati=[]

function formatNumero(n){

return Math.round(n).toLocaleString("it-IT")

}

function classe(v){

if(v>0) return "pos"
if(v<0) return "neg"
return "zero"

}

function deltaHTML(delta){

if(delta>0)
return `<span class="delta deltaUp">▲ ${formatNumero(delta)}</span>`

if(delta<0)
return `<span class="delta deltaDown">▼ ${formatNumero(delta)}</span>`

return `<span class="delta deltaFlat">→ 0</span>`

}

async function carica(){

const res=await fetch(API)

dati=await res.json()

costruisciHeader()

renderTabella()

graficoAnni()

graficoMesi()

}

function costruisciHeader(){

const header=document.getElementById("headerRow")

mesi.forEach(m=>{

header.innerHTML+=`<th>${m}</th><th>Δ</th>`

})

header.innerHTML+=`<th>Tot</th>`

}

function renderTabella(){

const tbody=document.querySelector("#tabella tbody")

tbody.innerHTML=""

dati.forEach((r,i)=>{

const prev=dati[i+1]

const tr=document.createElement("tr")

let html=`<td>${r.anno}</td>`

mesi.forEach(m=>{

const v=r[m]||0

html+=`<td class="${classe(v)}">${formatNumero(v)}</td>`

let delta=""

if(prev){

const diff=v-(prev[m]||0)

delta=deltaHTML(diff)

}

html+=`<td>${delta}</td>`

})

html+=`<td class="${classe(r.TotAnno)}">${formatNumero(r.TotAnno)}</td>`

tr.innerHTML=html

tbody.appendChild(tr)

})

}

function graficoAnni(){

const labels=[]
const valori=[]

dati.slice().reverse().forEach(r=>{

labels.push(r.anno)

valori.push(Math.round(r.TotAnno))

})

new Chart(

document.getElementById("graficoAnni"),

{
type:"line",

data:{
labels:labels,
datasets:[{
label:"Totale Annuale",
data:valori,
borderWidth:3,
tension:0.3
}]
},

options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{display:false}
}
}

})

}

function graficoMesi(){

const ultimo=dati[0]

const labels=[]
const valori=[]

mesi.forEach(m=>{

labels.push(m)

valori.push(Math.round(ultimo[m]||0))

})

new Chart(

document.getElementById("graficoMesi"),

{
type:"bar",

data:{
labels:labels,
datasets:[{
label:"Anno "+ultimo.anno,
data:valori
}]
},

options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{display:false}
}
}

})

}

carica()

</script>

</body>
</html>
