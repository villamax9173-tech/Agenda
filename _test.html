<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Analisi Bitcoin</title>

<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.summary {
    display: flex;
    gap: 20px;
}

.summary div {
    flex: 1;
    background: #fafafa;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
}

.highlight {
    background: #fff3cd;
    font-size: 20px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    padding: 8px;
    text-align: right;
}

th {
    background: #eee;
}

tr:nth-child(even) {
    background: #fafafa;
}

.positivo { color: green; }
.negativo { color: red; }

h1 { margin-bottom: 10px; }
</style>
</head>

<body>

<div id="menu-container"></div>
<script>
fetch("menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;
});
</script>

<div class="container">

<h1>Analisi Acquisti Bitcoin</h1>

<div class="card summary">
    <div class="highlight"><b>Capitale Disponibile</b><br><span id="capitale"></span></div>
    <div><b>Totale Investito</b><br><span id="totInvest"></span></div>
    <div><b>Valore Attuale</b><br><span id="totValore"></span></div>
    <div><b>Guadagno / Perdita</b><br><span id="totGain"></span></div>
    <div><b>BTC Portafoglio</b><br><span id="totBTC"></span></div>
</div>

<div class="card">
    <canvas id="chartPrezzo"></canvas>
</div>

<div class="card">
    <canvas id="chartCumulato"></canvas>
</div>

<div class="card">
    <canvas id="chartGain"></canvas>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Data</th>
<th>Invest</th>
<th>Impo</th>
<th>Comm</th>
<th>BTC</th>
<th>Prezzo</th>
<th>Valore Attuale</th>
<th>Gain €</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

</div>

<script>

const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetAcquisitiBitcoin?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

const fmt = v => v.toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});

fetch(url)
.then(res => res.json())
.then(data => {

    // 🔹 Ordinamento ASC per calcoli
    data.sort((a, b) => new Date(a.DataMovimento) - new Date(b.DataMovimento));

    const prezzoAttuale = data[data.length - 1].Valore;

    let totaleInvest = 0;
    let totaleBTC = 0;

    let cumulBTC = 0;
    let cumulInvest = 0;

    let labels = [];
    let prezzi = [];
    let cumulato = [];
    let gainCumulato = [];

    let pmcArray = [];
    let gainTotale = 0;

    data.forEach(r => {

        let invest = r.Invest || 0;
        let btc = r.AC || 0;

        totaleInvest += invest;
        totaleBTC += btc;

        cumulBTC += btc;
        cumulInvest += invest;

        let cumulValore = cumulBTC * prezzoAttuale;
        let gainProgressivo = cumulValore - cumulInvest;

        gainCumulato.push(gainProgressivo);
        cumulato.push(cumulBTC);
        prezzi.push(r.Prezzo);
        labels.push(r.DataMovimento);

        let pmc = cumulBTC > 0 ? cumulInvest / cumulBTC : 0;
        pmcArray.push(pmc);
    });

    // 🔹 Valori finali
    const ultimo = data[data.length - 1];

    let portafoglio = ultimo.Portafoglio || totaleBTC;
    let capitale = ultimo.Capitale || 0;

    let valoreTotale = portafoglio * prezzoAttuale;
    let gainTotale = valoreTotale - totaleInvest;
    

    document.getElementById("capitale").innerText = fmt(capitale) + " €";
    document.getElementById("totInvest").innerText = fmt(totaleInvest) + " €";
    document.getElementById("totValore").innerText = fmt(valoreTotale) + " €";
    document.getElementById("totGain").innerText = fmt(gainTotale) + " €";
    document.getElementById("totGain").className = gainTotale >= 0 ? "positivo" : "negativo";
    document.getElementById("totBTC").innerText = portafoglio.toFixed(6);

    // 🔹 Grafico prezzo + PMC
    new Chart(document.getElementById("chartPrezzo"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                { label: "Prezzo BTC", data: prezzi, tension: 0.3 },
                { label: "PMC", data: pmcArray, tension: 0.3 }
            ]
        }
    });

    // 🔹 BTC cumulati
    new Chart(document.getElementById("chartCumulato"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "BTC accumulati",
                data: cumulato,
                tension: 0.3
            }]
        }
    });

    // 🔹 Gain cumulato con colori dinamici
    new Chart(document.getElementById("chartGain"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Gain cumulato (€)",
                data: gainCumulato,
                tension: 0.3,
                segment: {
                    borderColor: ctx => ctx.p0.parsed.y >= 0 ? 'green' : 'red'
                }
            }]
        }
    });

    // 🔹 Tabella DESC
    const tbody = document.getElementById("tabella");

    data.slice().reverse().forEach(r => {

        let invest = r.Invest || 0;
        let impo = r.Impo || 0;
        let btc = r.AC || 0;

        let valoreRiga = btc * prezzoAttuale;
        let gain = valoreRiga - invest;
        
        gainTotale += gain;

        let tr = document.createElement("tr");

        tr.innerHTML = `
            <td style="text-align:left">${r.DataMovimento}</td>
            <td>${fmt(invest)}</td>
            <td>${fmt(impo)}</td>
            <td>${fmt(r.Comm || 0)}</td>
            <td>${btc.toFixed(6)}</td>
            <td>${fmt(r.Prezzo)}</td>
            <td>${fmt(valoreRiga)}</td>
            <td class="${gain >= 0 ? 'positivo' : 'negativo'}">${fmt(gain)}</td>
        `;

        tbody.appendChild(tr);
    });

});

</script>

</body>
</html>
