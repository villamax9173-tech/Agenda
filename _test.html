<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Movimenti Conto Corrente</title>

<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

h1 { text-align: center; }

.container {
    max-width: 1100px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 6px rgba(0,0,0,0.08);
}

table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; }

th {
    background: #2c3e50;
    color: white;
    text-align: left;
}

td { border-bottom: 1px solid #eee; }
tr:hover { background: #fafafa; }

.importo { text-align: right; font-weight: bold; }
.dare { color: #c0392b; }
.avere { color: #2e7d32; }

.data { color: #666; font-size: 13px; }
.causale { font-size: 14px; }

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

button.tab {
    margin-right:5px;
    padding:6px 10px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    background:#ddd;
}

button.tab.active {
    background:#2c3e50;
    color:white;
}

input {
    padding:6px;
    width:250px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<!-- LOGIN OVERLAY -->
<div id="loginBox" style="
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:#2c3e50;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
z-index:9999;
">
    <h2>Accesso richiesto</h2>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()" style="margin-top:10px;padding:8px 15px;">
        Accedi
    </button>
    <div id="errore" style="color:#ffcccc;margin-top:10px;"></div>
</div>

<div id="menu-container"></div>

<div class="container">
<h1>Movimenti Conto Corrente</h1>

<div id="tabs"></div>

<div class="card">
    <input type="text" id="filtro" placeholder="Cerca causale...">
    <div id="totali" style="margin:10px 0;font-weight:bold;"></div>

    <table id="tabella">
        <thead>
        <tr>
            <th>Data</th>
            <th>Causale</th>
            <th style="text-align:right">Importo</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="grid">
<div class="card">
    <h3>Saldo nel tempo</h3>
    <canvas id="saldoChart"></canvas>
</div>

<div class="card">
    <h3>Entrate vs Uscite</h3>
    <canvas id="pieChart"></canvas>
</div>
</div>

<div class="card">
    <h3>Spesa per giorno</h3>
    <canvas id="barChart"></canvas>
</div>

</div>

<script>
fetch("menu.html")
.then(r=>r.text())
.then(d=>document.getElementById("menu-container").innerHTML=d);

// -------------------- PASSWORD --------------------

function codificaData(data){
    const map = ['a','b','c','d','e','f','g','h','i','j'];
    return data.replace(/\d/g, d => map[d])
               .replace(/\//g, '@');
}

function generaPasswordOggi(){
    let oggi = new Date();

    let raw =
        String(oggi.getDate()).padStart(2,'0') + "/" +
        String(oggi.getMonth()+1).padStart(2,'0') + "/" +
        oggi.getFullYear();

    return codificaData(raw);
}

// -------------------- URL NASCOSTO --------------------

function getUrl(){

    let base = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCCTop?code=";

    let keyParts = [
        "I-rrqvXKD9io",
        "sCOpeRZbyFE",
        "uhXI_HuPb2Q",
        "ZoGpMU95g9A",
        "zFuuPP7BQ=="
    ];

    let pwd = generaPasswordOggi().length;

    let key = keyParts
        .sort((a,b)=> (a.length % pwd) - (b.length % pwd))
        .join("");

    return base + key;
}

// -------------------- LOGIN --------------------

function checkPassword(){

    let input = document.getElementById("passwordInput").value;
    let corretta = generaPasswordOggi();

    if(input === corretta){

        sessionStorage.setItem("auth","ok");

        document.getElementById("loginBox").style.display="none";

        caricaDati();

    } else {
        document.getElementById("errore").innerText="Password errata";
    }
}

window.onload = () => {
    if(sessionStorage.getItem("auth")==="ok"){
        document.getElementById("loginBox").style.display="none";
        caricaDati();
    }
};

// -------------------- DATI --------------------

let dati=[];
let datiPerMese={};
let meseAttivo="";
let filtroTesto="";

const mesi = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

let saldoChart, pieChart, barChart;

function caricaDati(){

fetch(getUrl())
.then(r=>r.json())
.then(json=>{

    dati = json.map(r=>{
        let d = normalizzaData(r.DataContabile);
        let date = new Date(d);

        return {
            data: date,
            label: date.getDate()+" "+mesi[date.getMonth()],
            causale: (r.Causale||"").trim(),
            importo: parseFloat(r.Importo),
            tipo: r.azione
        };
    });

    dati.sort((a,b)=>a.data-b.data);

    dati.forEach(r=>{
        let key = r.data.getFullYear()+"-"+(r.data.getMonth()+1).toString().padStart(2,'0');
        if(!datiPerMese[key]) datiPerMese[key]=[];
        datiPerMese[key].push(r);
    });

    meseAttivo = Object.keys(datiPerMese).sort().reverse()[0];

    creaTabs();
    renderTabella();
    creaGrafici();
});
}

// -------------------- UI --------------------

document.addEventListener("input", e=>{
    if(e.target.id==="filtro"){
        filtroTesto = e.target.value.toLowerCase();
        renderTabella();
        creaGrafici();
    }
});

function normalizzaData(d){
    if(!d) return "";
    let clean = d.replace(/[^\d-]/g,"");
    return clean.substring(0,10);
}

function creaTabs(){
    const container = document.getElementById("tabs");
    container.innerHTML="";

    Object.keys(datiPerMese).sort().reverse().forEach(k=>{
        let [anno,mese]=k.split("-");
        let nome = mesi[parseInt(mese)-1]+" "+anno;

        let btn=document.createElement("button");
        btn.className="tab"+(k===meseAttivo?" active":"");
        btn.innerText=nome;

        btn.onclick=()=>{
            meseAttivo=k;
            creaTabs();
            renderTabella();
            creaGrafici();
        };

        container.appendChild(btn);
    });
}

function renderTabella(){
    const tbody=document.querySelector("#tabella tbody");
    tbody.innerHTML="";

    let lista = datiPerMese[meseAttivo] || [];

    let entrate=0, uscite=0;

    lista
    .filter(r=>r.causale.toLowerCase().includes(filtroTesto))
    .slice().reverse()
    .forEach(r=>{

        if(r.importo>0) entrate+=r.importo;
        else uscite+=Math.abs(r.importo);

        let tipoClass = r.tipo==="D"?"dare":"avere";

        tbody.innerHTML+=`
        <tr>
            <td class="data">${r.label}</td>
            <td class="causale">${r.causale}</td>
            <td class="importo ${tipoClass}">
                ${r.importo.toFixed(2)}
            </td>
        </tr>`;
    });

    document.getElementById("totali").innerHTML =
        `Entrate: ${entrate.toFixed(2)} | Uscite: ${uscite.toFixed(2)} | Saldo: ${(entrate-uscite).toFixed(2)}`;
}

function creaGrafici(){

    let lista = datiPerMese[meseAttivo] || [];

    lista = lista.filter(r=>r.causale.toLowerCase().includes(filtroTesto));

    let labels=[], saldo=[], cumulato=0;
    let entrate=0, uscite=0;
    let perGiorno={};

    lista.forEach(r=>{
        cumulato+=r.importo;
        labels.push(r.label);
        saldo.push(cumulato);

        if(r.importo>0) entrate+=r.importo;
        else uscite+=Math.abs(r.importo);

        let key=r.data.toISOString().substring(0,10);

        if(!perGiorno[key]){
            perGiorno[key]={label:r.label,data:r.data,totale:0};
        }
        perGiorno[key].totale+=Math.abs(r.importo);
    });

    if(saldoChart) saldoChart.destroy();
    if(pieChart) pieChart.destroy();
    if(barChart) barChart.destroy();

    saldoChart = new Chart(document.getElementById("saldoChart"),{
        type:"line",
        data:{
            labels:labels,
            datasets:[{
                label:"Saldo",
                data:saldo,
                borderWidth:2,
                tension:0.3
            }]
        }
    });

    pieChart = new Chart(document.getElementById("pieChart"),{
        type:"pie",
        data:{
            labels:["Entrate","Uscite"],
            datasets:[{data:[entrate,uscite]}]
        }
    });

    let giorniArray = Object.values(perGiorno);
    giorniArray.sort((a,b)=>a.data-b.data);

    barChart = new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:giorniArray.map(g=>g.label),
            datasets:[{
                label:"Speso",
                data:giorniArray.map(g=>g.totale)
            }]
        }
    });
}
</script>

</body>
</html>
