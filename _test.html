<!DOCTYPE html>
<html lang="it">

<head>

<link rel="stylesheet" href="menu.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atlante Wanalis</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:20px;
background:#f7f7f7;
}

h1{
text-align:center;
}

canvas{
max-width:1000px;
margin:40px auto;
display:block;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:30px;
}

th,td{
padding:6px;
border:1px solid #ddd;
text-align:right;
font-size:13px;
}

th{
background:#eeeeee;
}

td:first-child,
th:first-child{
text-align:center;
font-weight:bold;
}

.pos{
color:green;
font-weight:bold;
}

.neg{
color:red;
font-weight:bold;
}

.zero{
color:#444;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<h1>Atlante Economico</h1>

<canvas id="graficoAnni"></canvas>

<canvas id="graficoMesi"></canvas>

<table id="tabella">
<thead>
<tr>
<th>Anno</th>
<th>Gen</th>
<th>Feb</th>
<th>Mar</th>
<th>Apr</th>
<th>Mag</th>
<th>Giu</th>
<th>Lug</th>
<th>Ago</th>
<th>Sett</th>
<th>Ott</th>
<th>Nov</th>
<th>Dic</th>
<th>Totale</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});

</script>

<script>

const API="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetAtlante?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="

const mesi=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Sett","Ott","Nov","Dic"]

let dati=[]

function formatNumero(n){

return Math.round(n).toLocaleString("it-IT")

}

function classe(v){

if(v>0) return "pos"
if(v<0) return "neg"
return "zero"

}

async function carica(){

const res=await fetch(API)

dati=await res.json()

renderTabella()

graficoAnni()

graficoMesi()

}

function renderTabella(){

const tbody=document.querySelector("#tabella tbody")

tbody.innerHTML=""

dati.forEach(r=>{

const tr=document.createElement("tr")

let html=`<td>${r.anno}</td>`

mesi.forEach(m=>{

const v=r[m]||0

html+=`<td class="${classe(v)}">${formatNumero(v)}</td>`

})

html+=`<td class="${classe(r.TotAnno)}">${formatNumero(r.TotAnno)}</td>`

tr.innerHTML=html

tbody.appendChild(tr)

})

}

function graficoAnni(){

const labels=[]
const valori=[]

dati.slice().reverse().forEach(r=>{

labels.push(r.anno)

valori.push(Math.round(r.TotAnno))

})

new Chart(

document.getElementById("graficoAnni"),

{
type:"line",

data:{
labels:labels,
datasets:[{
label:"Totale Annuale",
data:valori,
tension:0.3
}]
},

options:{
plugins:{
legend:{display:false}
}
}

})

}

function graficoMesi(){

const ultimo=dati[0]

const labels=[]
const valori=[]

mesi.forEach(m=>{

labels.push(m)

valori.push(Math.round(ultimo[m]||0))

})

new Chart(

document.getElementById("graficoMesi"),

{
type:"bar",

data:{
labels:labels,
datasets:[{
label:"Anno "+ultimo.anno,
data:valori
}]
},

options:{
plugins:{
legend:{display:false}
}
}

})

}

carica()

</script>

</body>

</html>
