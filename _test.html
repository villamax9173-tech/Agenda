<!DOCTYPE html>
<html lang="it">

<head>

<link rel="stylesheet" href="menu.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Andamento Differenze</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<style>

body{
font-family:Arial;
margin:20px;
background:#f7f7f7;
}

h1{
text-align:center;
margin-bottom:10px;
}

.filtro{
text-align:center;
margin:20px 0;
}

.filtro input,
.filtro button{
padding:8px 12px;
font-size:14px;
border-radius:6px;
border:1px solid #ccc;
}

.filtro button{
cursor:pointer;
background:#007bff;
color:white;
border:none;
}

.filtro button:hover{
background:#0056b3;
}

.riepilogo{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:20px;
}

.box{
background:white;
padding:15px 20px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
font-size:18px;
min-width:220px;
text-align:center;
}

.boxTitolo{
font-size:14px;
color:#666;
margin-bottom:6px;
}

.boxValore{
font-size:28px;
font-weight:bold;
}

.positivo{
color:green;
}

.negativo{
color:red;
}

#graficoContainer{
width:100%;
max-width:1600px;
height:700px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

canvas{
width:100% !important;
height:100% !important;
}

.infoExtra{
text-align:center;
margin-top:15px;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<script>
fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});
</script>

<h1>Andamento Differenze</h1>

<div class="filtro">

<input type="month" id="meseFiltro">

<button onclick="render()">Filtra</button>

<button onclick="meseCorrente()">Mese Corrente</button>

<button onclick="ultimi3Mesi()">Ultimi 3 Mesi</button>

<button onclick="tutto()">Tutto</button>

</div>

<div class="riepilogo">

<div class="box">
<div class="boxTitolo">Prima rilevazione</div>
<div class="boxValore" id="primaVal">0</div>
</div>

<div class="box">
<div class="boxTitolo">Ultima rilevazione</div>
<div class="boxValore" id="ultimaVal">0</div>
</div>

<div class="box">
<div class="boxTitolo">Differenza</div>
<div class="boxValore" id="diffVal">0</div>
</div>

<div class="box">
<div class="boxTitolo">Variazione %</div>
<div class="boxValore" id="percVal">0%</div>
</div>

</div>

<div id="graficoContainer">
<canvas id="grafico"></canvas>
</div>

<div class="infoExtra" id="infoExtra"></div>

<script>

const API="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetDifferenze?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="

let dati=[]
let grafico=null
let modalita="mese"

async function carica(){

const res=await fetch(API)

dati=await res.json()

meseCorrente()

}

function parseData(d){

const [y,m,day]=d.Data.split("-")

return new Date(y,m-1,day)

}

function meseCorrente(){

modalita="mese"

const now=new Date()

const mese=
now.getFullYear()+
"-"+
String(now.getMonth()+1).padStart(2,"0")

document.getElementById("meseFiltro").value=mese

render()

}

function ultimi3Mesi(){

modalita="3mesi"

render()

}

function tutto(){

modalita="tutto"

render()

}

function render(){

let filtrati=[]

const meseSel=document.getElementById("meseFiltro").value

if(modalita==="mese"){

filtrati=dati.filter(d=>{

const data=parseData(d)

const ym=
data.getFullYear()+
"-"+
String(data.getMonth()+1).padStart(2,"0")

return ym===meseSel

})

}
else if(modalita==="3mesi"){

const limite=new Date()
limite.setMonth(limite.getMonth()-3)

filtrati=dati.filter(d=>parseData(d)>=limite)

}
else{

filtrati=[...dati]

}

filtrati.sort((a,b)=>parseData(a)-parseData(b))

const labels=[]
const valori=[]

filtrati.forEach(d=>{

const data=parseData(d)

labels.push(data.toLocaleDateString("it-IT"))

valori.push(Math.round(d.Differenza))

})

const primo=valori.length ? valori[0] : 0
const ultimo=valori.length ? valori[valori.length-1] : 0

const diff=ultimo-primo

let perc=0

if(primo!==0){

perc=((diff/primo)*100)

}

const massimo=valori.length ? Math.max(...valori) : 0
const minimo=valori.length ? Math.min(...valori) : 0

document.getElementById("primaVal").innerText=Math.round(primo)

document.getElementById("ultimaVal").innerText=Math.round(ultimo)

document.getElementById("diffVal").innerText=Math.round(diff)

document.getElementById("percVal").innerText=Math.round(perc)+"%"

document.getElementById("diffVal").className=
"boxValore " + (diff>=0 ? "positivo":"negativo")

document.getElementById("percVal").className=
"boxValore " + (perc>=0 ? "positivo":"negativo")

document.getElementById("infoExtra").innerHTML=
`
Massimo: <span class="positivo">${massimo}</span>
&nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
Minimo: <span class="negativo">${minimo}</span>
&nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;
Rilevazioni: ${valori.length}
`

if(grafico) grafico.destroy()

const coloreLinea=ultimo>=0 ? "green" : "red"

grafico=new Chart(document.getElementById("grafico"),{

type:"line",

data:{

labels:labels,

datasets:[{

label:"Differenza",

data:valori,

borderColor:coloreLinea,

backgroundColor:coloreLinea,

borderWidth:3,

pointRadius:5,

pointHoverRadius:8,

fill:false,

tension:0.2

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{

legend:{
labels:{
font:{
size:16
}
}
},

datalabels:{

align:"top",

anchor:"end",

font:{
weight:"bold",
size:12
},

formatter:(v)=>v

}

},

scales:{

x:{
ticks:{
font:{
size:14
}
}
},

y:{

beginAtZero:false,

ticks:{
font:{
size:14
}
}

}

}

},

plugins:[ChartDataLabels]

})

}

document.getElementById("meseFiltro").addEventListener("change",()=>{

modalita="mese"

render()

})

carica()

</script>

</body>

</html>
