<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Analisi Bitcoin</title>

<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.summary {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.summary div {
    flex: 1 1 180px;
    background: #fafafa;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
}

.highlight {
    background: #fff3cd;
    font-size: 20px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    padding: 8px;
    text-align: right;
}

th {
    background: #eee;
}

tr:nth-child(even) {
    background: #fafafa;
}

.positivo { color: green; }
.negativo { color: red; }

h1 { margin-bottom: 10px; }
</style>
</head>

<body>

<div id="menu-container"></div>
<script>
fetch("menu.html")
.then(res => res.text())
.then(data => {
    document.getElementById("menu-container").innerHTML = data;
});
</script>

<div class="container">

<h1>Analisi Acquisti e Prelievi Bitcoin</h1>

<div class="card summary">
    <div class="highlight"><b>Capitale Disponibile</b><br><span id="capitale"></span></div>
    <div><b>BTC Portafoglio</b><br><span id="totBTC"></span></div>
    <div><b>Totale BTC Acquistati</b><br><span id="totBTCAcq"></span></div>
    <div><b>Totale Investito Complessivo</b><br><span id="totInvestCompl"></span></div>
    <div><b>Totale Importi Prelevati</b><br><span id="totPrelievi"></span></div>
    <div><b>Valore Bitcoin</b><br><span id="valoreBTC"></span></div>
    <div><b>Guadagno / Perdita</b><br><span id="totGain"></span></div>
    <div><b>Gain Positivi</b><br><span id="gainPos"></span></div>
    <div><b>Gain Negativi</b><br><span id="gainNeg"></span></div>
</div>

<div class="card">
    <canvas id="chartPrezzo"></canvas>
</div>

<div class="card">
    <canvas id="chartCumulato"></canvas>
</div>

<div class="card">
    <canvas id="chartGain"></canvas>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Data</th>
<th>Invest</th>
<th>Prelievo BTC</th>
<th>Importo Prelevato</th>
<th>Comm</th>
<th>BTC</th>
<th>Prezzo</th>
<th>Valore Attuale</th>
<th>Gain €</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

</div>

<script>
const fmt = v => v.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});

const urlAcquisti = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetAcquisitiBitcoin?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";
const urlPrelievi = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetPrelieviBitcoin?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

Promise.all([fetch(urlAcquisti).then(r=>r.json()), fetch(urlPrelievi).then(r=>r.json())])
.then(([acquisti, prelievi]) => {

    const dati = [];

    acquisti.forEach(a => {
        dati.push({
            tipo: "acquisto",
            data: a.DataMovimento,
            invest: a.Invest || 0,
            comm: a.Comm || 0,
            btc: a.AC || 0,
            prezzo: a.Prezzo || 0
        });
    });

    prelievi.forEach(p => {
        dati.push({
            tipo: "prelievo",
            data: p.DataPrelievo,
            btcPrelevati: p.BitCoinPrelevati || 0,
            importoPrelevato: p.ImportoPrelevato || 0,
            prezzo: p.PrezzoPrelievo || 0
        });
    });

    dati.sort((a,b)=>new Date(b.data)-new Date(a.data));

    let cumulBTCAcq = 0;
    let totaleInvestCompl = 0;
    let capitale = acquisti[acquisti.length-1].Capitale || 0;
    let valoreBitcoin = acquisti[acquisti.length-1].Valore || 0;
    let portafoglio = acquisti[acquisti.length-1].Portafoglio || 0;

    let gainTotale = 0;
    let totPrelievi = 0;
    let gainPositivi = 0;
    let gainNegativi = 0;

    let gainArray = [];

    const tbody = document.getElementById("tabella");

    dati.forEach(r => {

        let invest=0, btc=0, comm=0, valoreRiga=0, gain=0, btcPrelevati=0, importoPrelevato=0;

        if(r.tipo==="acquisto"){
            invest=r.invest;
            btc=r.btc;
            comm=r.comm;

            cumulBTCAcq += btc;

            valoreRiga = btc*valoreBitcoin;
            gain = valoreRiga - invest;

            gainTotale += gain;

            if(gain >= 0) gainPositivi += gain;
            else gainNegativi += gain;

            gainArray.push(gain);

        } else {
            btcPrelevati = r.btcPrelevati;
            importoPrelevato = r.importoPrelevato;

            totPrelievi += importoPrelevato;

            gainArray.push(0);
        }

        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td style="text-align:left">${r.data}</td>
            <td>${fmt(invest)}</td>
            <td>${btcPrelevati.toFixed(6)}</td>
            <td>${fmt(importoPrelevato)}</td>
            <td>${fmt(comm)}</td>
            <td>${r.tipo==="acquisto"?btc.toFixed(6):""}</td>
            <td>${fmt(r.prezzo||0)}</td>
            <td>${r.tipo==="acquisto"?fmt(valoreRiga):""}</td>
            <td class="${gain>=0?'positivo':'negativo'}">${r.tipo==="acquisto"?fmt(gain):""}</td>
        `;
        tbody.appendChild(tr);
    });

    totaleInvestCompl = cumulBTCAcq*valoreBitcoin;

    document.getElementById("capitale").innerText = fmt(capitale)+" €";
    document.getElementById("totBTC").innerText = portafoglio.toFixed(6);
    document.getElementById("totBTCAcq").innerText = cumulBTCAcq.toFixed(6);
    document.getElementById("totInvestCompl").innerText = fmt(totaleInvestCompl)+" €";
    document.getElementById("totPrelievi").innerText = fmt(totPrelievi)+" €";
    document.getElementById("valoreBTC").innerText = fmt(valoreBitcoin)+" €";
    document.getElementById("totGain").innerText = fmt(gainTotale)+" €";
    document.getElementById("totGain").className = gainTotale>=0?"positivo":"negativo";

    document.getElementById("gainPos").innerText = fmt(gainPositivi)+" €";
    document.getElementById("gainPos").className = "positivo";

    document.getElementById("gainNeg").innerText = fmt(gainNegativi)+" €";
    document.getElementById("gainNeg").className = "negativo";

    // grafico gain cumulato basato su tabella
    let gainCumulato = [];
    let cumul = 0;

    gainArray.slice().reverse().forEach(g => {
        cumul += g;
        gainCumulato.push(cumul);
    });

    let labels = dati.map(d=>d.data).reverse();

    new Chart(document.getElementById("chartGain"),{
        type:"line",
        data:{
            labels,
            datasets:[{
                label:"Gain cumulato (€)",
                data:gainCumulato,
                tension:0.3,
                segment:{
                    borderColor:ctx=>ctx.p0.parsed.y>=0?'green':'red'
                }
            }]
        }
    });

});
</script>

</body>
</html>
