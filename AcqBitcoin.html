<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Analisi Bitcoin</title>

<link rel="stylesheet" href="menu.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.summary {
    display: flex;
    gap: 20px;
}

.summary div {
    flex: 1;
    background: #fafafa;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    padding: 8px;
    text-align: right;
}

th {
    background: #eee;
}

tr:nth-child(even) {
    background: #fafafa;
}

.positivo { color: green; }
.negativo { color: red; }

h1 { margin-bottom: 10px; }
</style>
</head>

<body>

<div id="menu-container"></div>
<script>
fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});
</script>

<div class="container">

<h1>Analisi Acquisti Bitcoin</h1>

<div class="card summary">
    <div><b>Totale Investito</b><br><span id="totInvest"></span></div>
    <div><b>Valore Attuale</b><br><span id="totValore"></span></div>
    <div><b>Guadagno / Perdita</b><br><span id="totGain"></span></div>
    <div><b>BTC Totali</b><br><span id="totBTC"></span></div>
</div>

<div class="card">
    <canvas id="chartPrezzo"></canvas>
</div>

<div class="card">
    <canvas id="chartCumulato"></canvas>
</div>

<div class="card">
    <canvas id="chartGain"></canvas>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Data</th>
<th>Invest</th>
<th>Impo</th>
<th>Comm</th>
<th>BTC</th>
<th>Prezzo</th>
<th>Valore Attuale</th>
<th>Gain €</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

</div>

<script>

const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetAcquisitiBitcoin?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

fetch(url)
.then(res => res.json())
.then(data => {

    let totaleInvest = 0;
    let totaleBTC = 0;

    const tbody = document.getElementById("tabella");

    let labels = [];
    let prezzi = [];
    let cumulato = [];
    let gainCumulato = [];

    let cumulBTC = 0;
    let cumulInvest = 0;
    let cumulValore = 0;

    data.reverse();

    data.forEach(r => {

        let invest = r.Invest || 0;
        let impo = r.Impo || 0;
        let btc = r.AC || 0;
        let prezzo = r.Prezzo || 0;
        let valoreBTC = r.Valore || 0;

        totaleInvest += invest;
        totaleBTC += btc;

        cumulBTC += btc;
        cumulInvest += invest;

        cumulValore = cumulBTC * valoreBTC;
        let gainProgressivo = cumulValore - cumulInvest;

        gainCumulato.push(gainProgressivo);

        let valoreRiga = btc * valoreBTC;
        let gain = valoreRiga - invest;

        let tr = document.createElement("tr");

        tr.innerHTML = `
            <td style="text-align:left">${r.DataMovimento}</td>
            <td>${invest.toFixed(2)}</td>
            <td>${impo.toFixed(2)}</td>
            <td>${(r.Comm || 0).toFixed(2)}</td>
            <td>${btc.toFixed(6)}</td>
            <td>${prezzo.toFixed(0)}</td>
            <td>${valoreRiga.toFixed(2)}</td>
            <td class="${gain >= 0 ? 'positivo' : 'negativo'}">${gain.toFixed(2)}</td>
        `;

        tbody.appendChild(tr);

        labels.push(r.DataMovimento);
        prezzi.push(prezzo);
        cumulato.push(cumulBTC);
    });

    let valoreTotale = totaleBTC * data[0].Valore;
    let gainTotale = valoreTotale - totaleInvest;

    document.getElementById("totInvest").innerText = totaleInvest.toFixed(2) + " €";
    document.getElementById("totValore").innerText = valoreTotale.toFixed(2) + " €";
    document.getElementById("totGain").innerText = gainTotale.toFixed(2) + " €";
    document.getElementById("totGain").className = gainTotale >= 0 ? "positivo" : "negativo";
    document.getElementById("totBTC").innerText = totaleBTC.toFixed(6);

    new Chart(document.getElementById("chartPrezzo"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Prezzo BTC",
                data: prezzi
            }]
        }
    });

    new Chart(document.getElementById("chartCumulato"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "BTC accumulati",
                data: cumulato
            }]
        }
    });

    new Chart(document.getElementById("chartGain"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Gain cumulato (€)",
                data: gainCumulato,
                borderColor: gainCumulato.map(v => v >= 0 ? 'green' : 'red')
            }]
        }
    });

});

</script>

</body>
</html>
