<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="stylesheet" href="menu.css">
    <meta charset="UTF-8">
    <title>Etichette Villamax</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            color: #333;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
        }

        .item {
            background-color: #ffffff;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .item:hover {
            transform: scale(1.02);
            background-color: #e8f5e9;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .highlight {
            background-color: #fff3cd; /* leggero giallo per evidenziare il saldo fine mese */
        }
    </style>
</head>
<body>
    <div id="menu-container"></div>
    <h1>Elenco Etichette</h1>
    <div id="etichettaContainer">
        <!-- I dati verranno inseriti qui -->
    </div>
<script>

fetch("menu.html")
.then(res => res.text())
.then(data => {
document.getElementById("menu-container").innerHTML = data;
});

</script>
    <script>
        const apiUrl = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetEtichette?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

        function formatEuro(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return "-";
            return num.toLocaleString('it-IT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function loadEtichette() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const container = document.getElementById("etichettaContainer");
                container.innerHTML = "";

                let saldo = 0;
                let guadagno = 0;

                data.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "item";

                    const labelText = item.Etichetta ?? item.etichetta ?? "-";
                    let valoreText;

                    // Controllo speciale per BitCoin Portafoglio
                    if (labelText === "BitCoin Portafoglio") {
                        valoreText = item.Valore ?? item.valore ?? "-";
                    } else {
                        const valNum = parseFloat(item.Valore ?? item.valore ?? 0);
                        valoreText = formatEuro(valNum);

                        // Salvo Saldo e Guadagno per il calcolo
                        if (labelText === "Saldo") saldo = valNum;
                        if (labelText === "Guadagno") guadagno = valNum;
                    }

                    div.innerHTML = `<span class="label">${labelText}</span> <span class="value">${valoreText}</span>`;
                    container.appendChild(div);
                });

                // Aggiungo la voce "Saldo fine Mese"
                const divFineMese = document.createElement("div");
                divFineMese.className = "item highlight";
                const saldoFineMese = saldo + guadagno;
                divFineMese.innerHTML = `<span class="label">Saldo fine Mese</span> <span class="value">${formatEuro(saldoFineMese)}</span>`;
                container.appendChild(divFineMese);

            } catch (error) {
                console.error("Errore nel caricamento delle etichette:", error);
            }
        }

        loadEtichette();
    </script>
</body>
</html>
