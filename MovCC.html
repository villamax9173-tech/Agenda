<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Dashboard Conto Corrente</title>

<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; margin:20px; background:#f5f5f5;}
h1 { text-align:center;}

.container { max-width:1200px; margin:auto;}

.card {
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

.grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:20px;
}

table { width:100%; border-collapse:collapse;}
th,td { padding:8px; text-align:center;}
th { background:#333; color:white;}

tr:nth-child(even){background:#f2f2f2;}

.dare { color:#c0392b; font-weight:bold;}
.avere { color:#27ae60; font-weight:bold;}

.big { background:#ffe0e0;}
.medium { background:#fff6cc;}
.small { background:#e6ffe6;}

</style>
</head>

<body>

<div id="menu-container"></div>

<div class="container">
<h1>📊 Dashboard Conto Corrente</h1>

<!-- GRAFICI -->
<div class="grid">

<div class="card">
    <h3>Saldo nel tempo</h3>
    <canvas id="saldoChart"></canvas>
</div>

<div class="card">
    <h3>Entrate vs Uscite</h3>
    <canvas id="pieChart"></canvas>
</div>

</div>

<div class="card">
    <h3>Spese per giorno</h3>
    <canvas id="barChart"></canvas>
</div>

<!-- TABELLA -->
<div class="card">
<table id="tabella">
<thead>
<tr>
<th>Data</th>
<th>Causale</th>
<th>Importo</th>
<th>Tipo</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>
// MENU
fetch("menu.html")
.then(r=>r.text())
.then(d=>document.getElementById("menu-container").innerHTML=d);

const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCCTop?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

let dati=[];

const mesi = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];

fetch(url)
.then(r=>r.json())
.then(json=>{

    dati = json.map(r=>{
        let d = normalizzaData(r.DataContabile);
        let date = new Date(d);

        return {
            data: date,
            label: date.getDate()+" "+mesi[date.getMonth()],
            causale: (r.Causale||"").trim(),
            importo: parseFloat(r.Importo),
            tipo: r.azione
        };
    });

    dati.sort((a,b)=>a.data-b.data);

    renderTabella();
    creaGrafici();
});

// NORMALIZZA DATA
function normalizzaData(d){
    if(!d) return "";
    let clean = d.replace(/[^\d-]/g,"");
    return clean.substring(0,10);
}

// TABELLA
function renderTabella(){
    const tbody=document.querySelector("#tabella tbody");
    tbody.innerHTML="";

    dati.slice().reverse().forEach(r=>{

        let tipoClass = r.tipo==="D"?"dare":"avere";
        let icon = r.tipo==="D"?"💸":"💰";

        let abs=Math.abs(r.importo);
        let sizeClass = abs>200?"big":abs>50?"medium":"small";

        tbody.innerHTML+=`
        <tr class="${tipoClass} ${sizeClass}">
            <td>${r.label}</td>
            <td style="text-align:left">${r.causale}</td>
            <td>${r.importo.toFixed(2)}</td>
            <td>${icon}</td>
        </tr>`;
    });
}

// GRAFICI
function creaGrafici(){

    let labels=[];
    let saldo=[];
    let cumulato=0;

    let entrate=0;
    let uscite=0;

    let perGiorno={};

    dati.forEach(r=>{

        cumulato+=r.importo;

        labels.push(r.label);
        saldo.push(cumulato);

        if(r.importo>0) entrate+=r.importo;
        else uscite+=Math.abs(r.importo);

        if(!perGiorno[r.label]) perGiorno[r.label]=0;
        perGiorno[r.label]+=Math.abs(r.importo);
    });

    // SALDO
    new Chart(document.getElementById("saldoChart"),{
        type:"line",
        data:{
            labels:labels,
            datasets:[{label:"Saldo",data:saldo}]
        }
    });

    // TORTA
    new Chart(document.getElementById("pieChart"),{
        type:"pie",
        data:{
            labels:["Entrate","Uscite"],
            datasets:[{
                data:[entrate,uscite]
            }]
        }
    });

    // BAR
    new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:Object.keys(perGiorno),
            datasets:[{
                label:"Speso",
                data:Object.values(perGiorno)
            }]
        }
    });

}
</script>

</body>
</html>
