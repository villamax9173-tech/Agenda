<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Movimenti Conto Corrente</title>

<link rel="stylesheet" href="menu.css">

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
}

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

input, select {
    padding: 5px;
}

button {
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #555;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    text-align: center;
}

th {
    background: #333;
    color: white;
    cursor: pointer;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

.dare { color: #c0392b; font-weight: bold; }
.avere { color: #27ae60; font-weight: bold; }

.big { background: #ffe0e0; }     /* importi alti */
.medium { background: #fff6cc; }  /* medi */
.small { background: #e6ffe6; }   /* piccoli */

</style>
</head>

<body>

<div id="menu-container"></div>

<div class="container">
<h1>📊 Movimenti Conto Corrente</h1>

<div class="card">

<div class="filters">
    <select id="tipo">
        <option value="T">Tutti</option>
        <option value="D">Dare</option>
        <option value="A">Avere</option>
    </select>

    <input type="number" id="min" placeholder="Importo min">
    <input type="number" id="max" placeholder="Importo max">

    <button onclick="filtra()">Filtra</button>
    <button onclick="reset()">Reset</button>
</div>

<table id="tabella">
<thead>
<tr>
<th onclick="ordina(0)">ID</th>
<th onclick="ordina(1)">Data</th>
<th onclick="ordina(2)">Causale</th>
<th onclick="ordina(3)">Importo</th>
<th onclick="ordina(4)">Tipo</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>
</div>

<script>
// MENU
fetch("menu.html")
.then(r => r.text())
.then(d => document.getElementById("menu-container").innerHTML = d);

// 🔗 AZURE FUNCTION
const url = "https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCCTop?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==";

let dati = [];

// CARICA DATI
fetch(url)
.then(r => r.json())
.then(json => {
    dati = json.map(r => {
        return {
            id: r.id,
            data: normalizzaData(r.DataContabile),
            causale: (r.Causale || "").trim(),
            importo: parseFloat(r.Importo),
            tipo: r.azione
        };
    });

    render(dati);
});

// NORMALIZZA DATA (gestisce "poi 23")
function normalizzaData(d) {
    if (!d) return "";
    let clean = d.replace(/[^\d-]/g, "");
    return clean.length >= 10 ? clean.substring(0,10) : d;
}

// RENDER
function render(lista) {
    const tbody = document.querySelector("#tabella tbody");
    tbody.innerHTML = "";

    lista.forEach(r => {

        let tipoClass = r.tipo === "D" ? "dare" : "avere";
        let icon = r.tipo === "D" ? "💸" : "💰";

        let abs = Math.abs(r.importo);
        let sizeClass = abs > 200 ? "big" : abs > 50 ? "medium" : "small";

        tbody.innerHTML += `
        <tr class="${tipoClass} ${sizeClass}">
            <td>${r.id}</td>
            <td>${r.data}</td>
            <td style="text-align:left">${r.causale}</td>
            <td>${r.importo.toFixed(2)}</td>
            <td>${icon}</td>
        </tr>`;
    });
}

// FILTRI
function filtra() {
    let tipo = document.getElementById("tipo").value;
    let min = parseFloat(document.getElementById("min").value) || -999999;
    let max = parseFloat(document.getElementById("max").value) || 999999;

    let filtrati = dati.filter(r => {
        let okTipo = tipo === "T" || r.tipo === tipo;
        let okImporto = r.importo >= min && r.importo <= max;
        return okTipo && okImporto;
    });

    render(filtrati);
}

function reset() {
    document.getElementById("tipo").value = "T";
    document.getElementById("min").value = "";
    document.getElementById("max").value = "";
    render(dati);
}

// ORDINAMENTO
function ordina(n) {
    let rows = Array.from(document.querySelectorAll("#tabella tbody tr"));

    rows.sort((a,b) => {
        let x = a.children[n].innerText;
        let y = b.children[n].innerText;

        let nx = parseFloat(x);
        let ny = parseFloat(y);

        if (!isNaN(nx) && !isNaN(ny)) return ny - nx;
        return y.localeCompare(x);
    });

    let tbody = document.querySelector("#tabella tbody");
    tbody.innerHTML = "";
    rows.forEach(r => tbody.appendChild(r));
}
</script>

</body>
</html>
