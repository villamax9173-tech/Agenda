<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
background:black;
color:#ffff66;
font-family:Verdana;
text-align:center;
}

.titolo{
font-size:36px;
margin-top:60px;
}

.clock img{
width:70px;
}

.sep{
font-size:90px;
padding:0 15px;
}

</style>

</head>

<body>

<div class="titolo" id="titolo"></div>

<br><br>

<div class="clock">

<img id="gg_mgl" src="imm/0.gif">
<img id="gg_cent" src="imm/0.gif">
<img id="gg_dec" src="imm/0.gif">
<img id="gg_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="hh_dec" src="imm/0.gif">
<img id="hh_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="mm_dec" src="imm/0.gif">
<img id="mm_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="ss_dec" src="imm/0.gif">
<img id="ss_un" src="imm/0.gif">

</div>

<script>

const API_GET="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCountdownById?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==&id="

var url=new URL(window.location.href)
var id=url.searchParams.get("id")

var targetDate=null

load()

setInterval(update,1000)

function load(){

fetch(API_GET+id)
.then(r=>r.json())
.then(d=>{

document.getElementById("titolo").innerText=d.descrizione

targetDate=new Date(d.data)

})

}

function update(){

if(!targetDate) return

var now=new Date()

var diff=targetDate-now

if(diff<0) diff=0

var g=Math.floor(diff/1000/60/60/24)
var h=Math.floor(diff/1000/60/60)%24
var m=Math.floor(diff/1000/60)%60
var s=Math.floor(diff/1000)%60

set4("gg",g)
set2("hh",h)
set2("mm",m)
set2("ss",s)

}

function set2(p,v){

v=("0"+v).slice(-2)

document.getElementById(p+"_dec").src="imm/"+v[0]+".gif"
document.getElementById(p+"_un").src="imm/"+v[1]+".gif"

}

function set4(p,v){

v=("000"+v).slice(-4)

document.getElementById(p+"_mgl").src="imm/"+v[0]+".gif"
document.getElementById(p+"_cent").src="imm/"+v[1]+".gif"
document.getElementById(p+"_dec").src="imm/"+v[2]+".gif"
document.getElementById(p+"_un").src="imm/"+v[3]+".gif"

}

</script>

</body>
</html>
