
<!DOCTYPE html>
<html>
<head>
<style>
body{background:black;color:#ffff66;font-family:Verdana;text-align:center}
.titolo{font-size:32px;margin-top:40px}
.clock img{width:60px}
.sep{font-size:80px;padding:0 10px}
</style>
</head>
<body>

<div class="titolo" id="titolo"></div>

<br><br>

<div class="clock">
<img id="gg_mgl" src="imm/0.gif">
<img id="gg_cent" src="imm/0.gif">
<img id="gg_dec" src="imm/0.gif">
<img id="gg_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="hh_dec" src="imm/0.gif">
<img id="hh_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="mm_dec" src="imm/0.gif">
<img id="mm_un" src="imm/0.gif">

<span class="sep">:</span>

<img id="ss_dec" src="imm/0.gif">
<img id="ss_un" src="imm/0.gif">
</div>

<script>

var api="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCountdownById?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="

var url=new URL(window.location.href)
var id=url.searchParams.get("id")
var targetDate

loadData()
setInterval(update,1000)
setInterval(loadData,60000)

function loadData(){
fetch(api+"GetCountdownById?id="+id)
.then(r=>r.json())
.then(d=>{
document.getElementById("titolo").innerText=d.descrizione
targetDate=new Date(d.data)
})
}

function update(){

if(!targetDate) return

var now=new Date()
var diff=targetDate-now
if(diff<0) diff=0

var giorni=Math.floor(diff/1000/60/60/24)
var ore=Math.floor(diff/1000/60/60)%24
var min=Math.floor(diff/1000/60)%60
var sec=Math.floor(diff/1000)%60

set4("gg",giorni)
set2("hh",ore)
set2("mm",min)
set2("ss",sec)

}

function set2(pref,val){
val=("0"+val).slice(-2)
document.getElementById(pref+"_dec").src="imm/"+val[0]+".gif"
document.getElementById(pref+"_un").src="imm/"+val[1]+".gif"
}

function set4(pref,val){
val=("000"+val).slice(-4)
document.getElementById(pref+"_mgl").src="imm/"+val[0]+".gif"
document.getElementById(pref+"_cent").src="imm/"+val[1]+".gif"
document.getElementById(pref+"_dec").src="imm/"+val[2]+".gif"
document.getElementById(pref+"_un").src="imm/"+val[3]+".gif"
}

</script>

</body>
</html>
