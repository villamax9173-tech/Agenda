<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<style>

body{
font-family:Segoe UI,Arial;
background:#f4f6f9;
margin:40px;
}

h1{
color:#333;
}

.panel{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0078d4;
color:white;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f1f1f1;
cursor:pointer;
}

button{
background:#0078d4;
border:none;
color:white;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

button.delete{
background:#d83b01;
}

input{
padding:6px;
margin-right:10px;
}

</style>

</head>

<body>

<h1>Countdown Manager</h1>

<div class="panel">

<h3>Nuovo Countdown</h3>

Data
<input id="data" type="datetime-local">

Descrizione
<input id="desc">

<button onclick="insert()">Inserisci</button>

</div>

<div class="panel">

<h3>Elenco Countdown</h3>

<table id="tab">

<thead>
<tr>
<th>ID</th>
<th>Data</th>
<th>Descrizione</th>
<th>Azioni</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const API_SELECT="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/GetCountdowns?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="

const API_DELETE="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/DeleteCountdown?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ==&id="

const API_INSERT="https://agendavillamaxapi-dyhrhdhzdzewh5hz.canadacentral-01.azurewebsites.net/api/InsertCountdown?code=I-rrqvXKD9iosCOpeRZbyFEuhXI_HuPb2QZoGpMU95g9AzFuuPP7BQ=="


function load(){

fetch(API_SELECT)
.then(r=>r.json())
.then(data=>{

let tb=document.querySelector("#tab tbody")

tb.innerHTML=""

data.forEach(x=>{

tb.innerHTML+=`
<tr onclick="openCountdown(${x.id})">

<td>${x.id}</td>
<td>${x.data}</td>
<td>${x.descrizione}</td>

<td>

<button class="delete"
onclick="del(${x.id});event.stopPropagation();">
Delete
</button>

</td>

</tr>`

})

})

}

async function insert(){

let d=document.getElementById("data").value
let desc=document.getElementById("desc").value

let payload={
data:new Date(d).toISOString(),
descrizione:desc
}

await fetch(API_INSERT,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
})

load()

}

function del(id){

if(!confirm("Cancellare countdown?")) return

fetch(API_DELETE+id)
.then(()=>load())

}

function openCountdown(id){

window.location="countdown_led.html?id="+id

}

load()

</script>

</body>
</html>
